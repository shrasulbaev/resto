# Free test server on Render (render.com): New → Blueprint → this repo.
# Seeds the demo venue on first start. Free instances sleep after 15 minutes
# idle (first open then takes ~1 minute) and uploaded photos are not kept
# across restarts. For real use, deploy with docker-compose.yml instead.
services:
  - type: web
    name: resto
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resto-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com

databases:
  - name: resto-db
    plan: free
    region: frankfurt
    databaseName: resto
    user: resto
